name: seal-build
# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Package json-smart
        run: mvn -B -V --no-transfer-progress -f json-smart/pom.xml clean package -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: json-smart-jar
          path: json-smart/target/json-smart-2.4.8.jar
          if-no-files-found: error
